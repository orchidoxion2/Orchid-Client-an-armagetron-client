# Orchid Client defaults, applied at every start after the saved settings.
# Your own autoexec.cfg in your settings folder replaces this file completely.

ZONE_HEIGHT 2
ZONE_SEGMENTS 22
ZONE_ALPHA 0.2
CAMERA_CUSTOM_RISE 19.5
CAMERA_CUSTOM_BACK 20
CAMERA_CUSTOM_PITCH -0.75
# The glance camera position settings were removed from this version of the game;
# glances turn the custom camera above instead. Kept here for reference.
# CAMERA_GLANCE_BACK 20
# CAMERA_GLANCE_RISE 19.5
# CAMERA_GLANCE_PITCH -0.75
START_FOV_1 85
MAX_IN_RATE 512
MAX_OUT_RATE 512
