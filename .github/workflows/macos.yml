# Builds Orchid Client for macOS on GitHub's Mac machines, once for Apple Silicon and once for Intel Macs.
# The apps show up as downloads ("artifacts") on the run's page in the Actions tab.
# When a release is published, the two zips are also added to that release.
name: macOS build

on:
  push:
    branches: [source]
    tags: ['v*']   # a version tag: the zips are added to the release with that name, if there is one
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14        # Apple Silicon (M1 and newer)
            arch: arm64
          - runner: macos-15-intel  # Intel Macs
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tags, for the version number

      - name: Install build tools and libraries
        run: |
          brew update > /dev/null
          brew install autoconf automake libtool pkg-config boost sdl2 sdl2_image sdl2_mixer \
            libxml2 freetype ftgl libpng glew dylibbundler

      - name: Cache protobuf
        uses: actions/cache@v4
        with:
          path: build/mac/protobuf
          key: protobuf-3.21.12-${{ matrix.runner }}

      - name: Build the app
        run: |
          mkdir -p build
          orchi/build-macos.sh 2>&1 | tee build/build-macos.log

      - name: Show the build logs
        if: failure()
        run: |
          for f in build/build-macos.log build/mac/protobuf-src/protobuf-3.21.12/make.log build/mac/build/configure.log build/mac/build/config.log build/mac/build/make.log build/mac/dylibbundler.log; do
            test -f "$f" || continue
            echo "===== $f"; tail -100 "$f"
            # also as an annotation, so the error shows up on the commit's checks
            msg="$(grep -iE -B2 -A3 'error|not found|failed' "$f" | tail -60)"
            test -n "$msg" || msg="$(tail -40 "$f")"
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/}"; msg="${msg//$'\n'/'%0A'}"
            echo "::error title=$(basename "$f")::${msg:0:20000}"
          done
          true

      - uses: actions/upload-artifact@v4
        with:
          name: orchid-client-macos-${{ matrix.arch }}
          path: build/mac/orchid-client-macos-${{ matrix.arch }}.zip

      - name: Add to the release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" build/mac/orchid-client-macos-${{ matrix.arch }}.zip --clobber
          else
            echo "no release named $TAG yet; the zip is in this run's artifacts"
          fi
